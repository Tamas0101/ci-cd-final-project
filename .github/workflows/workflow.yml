name: CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.9-slim

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        id: dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        id: lint
        run: |
          flake8 service --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 service --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Run unit tests with nose
        id: tests
        run: nosetests -v --with-spec --spec-color --with-coverage --cover-package=app

      - name: Save successful CI validation
        if: success()
        run: |
          {
            echo "CI workflow validation"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Overall result: success"
            echo "Checkout: ${{ steps.checkout.outcome }}"
            echo "Install dependencies: ${{ steps.dependencies.outcome }}"
            echo "Lint with flake8: ${{ steps.lint.outcome }}"
            echo "Run unit tests with nose: ${{ steps.tests.outcome }}"
            echo "Run URL: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } | tee cicd-github-validate

      - name: Upload CI validation evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cicd-github-validate
          path: cicd-github-validate
