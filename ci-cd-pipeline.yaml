apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: ci-cd-pipeline
spec:
  workspaces:
    - name: output
  params:
    - name: build-image
      type: string
      description: Full OpenShift image registry path for the image to build
    - name: app-name
      type: string
      default: cicd-app
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: output
    - name: git-clone
      runAfter:
        - cleanup
      taskRef:
        name: git-clone
      params:
        - name: url
          value: "https://github.com/ibm-developer-skills-network/wtecc-CICD_PracticeCode"
        - name: revision
          value: "main"
      workspaces:
        - name: output
          workspace: output
    - name: flake8
      runAfter:
        - git-clone
      taskRef:
        name: flake8
      params:
        - name: image
          value: "python:3.9-slim"
        - name: args
          value: ["--count", "--max-complexity=10", "--max-line-length=127"]
      workspaces:
        - name: source
          workspace: output
    - name: nose
      runAfter:
        - flake8
      taskRef:
        name: nose
      workspaces:
        - name: source
          workspace: output
    - name: buildah
      runAfter:
        - nose
      taskRef:
        name: buildah
        kind: ClusterTask
      params:
        - name: IMAGE
          value: "$(params.build-image)"
      workspaces:
        - name: source
          workspace: output
    - name: deploy
      runAfter:
        - buildah
      taskRef:
        name: openshift-client
        kind: ClusterTask
      params:
        - name: SCRIPT
          value: "oc create deployment $(params.app-name) --image=$(params.build-image) --dry-run=client -o yaml | oc apply -f -"
